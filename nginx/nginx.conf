# user  root;  # Enable the "user" directive only if the master process runs with super-user privileges
# One worker per core. On the 2-vCPU c5a.large this is 2; on a scaled-up
# instance it picks up the extra cores for TLS termination without another edit.
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # NOTE: nginx warns "could not build optimal uwsgi_params_hash, you should
    # increase either uwsgi_params_hash_max_size: 512 or
    # uwsgi_params_hash_bucket_size: 64" at startup (our long uwsgi_param names
    # like HTTP_X_FORWARDED_PROTO overflow the bucket). That advice is generated
    # by nginx's generic hash code, but NO such directives exist in the uwsgi
    # module -- its params-hash sizes are hardcoded -- so following the advice
    # produces [emerg] unknown directive and nginx refuses to start. The warning
    # is benign and unavoidable; live with it.
    # `rt` is the whole request including the client; `urt` is uwsgi alone. The
    # gap between them is the diagnosis: rt high with urt low is a slow client or
    # a large upload, urt high is the application. `host` names the deck, which
    # matters because one tenant's traffic is what a load spike usually is.
    log_format  timed '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent '
                      'rt=$request_time urt=$upstream_response_time host=$host '
                      '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

    # On, so a slow request can be attributed to a URL and a deck. Static, js and
    # css are excluded per-location in bytedeck.conf.template, so this logs the
    # dynamic requests only and stays small. Docker's json-file rotation bounds
    # the container's own logs; this file is inside the container and goes with it.
    access_log  /var/log/nginx/access.log  timed;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    # Gzip Compression
    gzip on;
    # gzip_min_length 1000;
    # JSON belongs here: a quest map ships its whole `elements_json` in one
    # response, which is the largest thing a class hitting the maps at once
    # pulls. text/html is always gzipped and needs no entry.
    gzip_types text/plain text/css application/json application/javascript application/xml;
    gzip_proxied expired no-cache no-store private auth;
    gzip_vary on;

    # include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-available/*;
}