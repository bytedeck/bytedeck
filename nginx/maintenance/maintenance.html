  <style>
    :root { --brand:#4a90d9; --ink:#2c3e50; --muted:#6b7c8f; --bg:#f4f7fb; --card:#ffffff; }
    * { box-sizing:border-box; }
    html,body { height:100%; margin:0; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg); color:var(--ink);
      display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .card {
      background:var(--card); max-width:520px; width:100%;
      padding:48px 40px; border-radius:14px; text-align:center;
      box-shadow:0 10px 40px rgba(44,62,80,.12);
    }
    .logo { width:210px; max-width:72%; height:auto; margin:0 auto 30px; display:block; }
    h1 { font-size:1.6rem; margin:0 0 12px; font-weight:600; }
    p { font-size:1.05rem; line-height:1.6; color:var(--muted); margin:0 0 8px; }
    .dots { margin-top:30px; }
    .dots span {
      display:inline-block; width:10px; height:10px; margin:0 4px; border-radius:50%;
      background:var(--brand); opacity:.35; animation:pulse 1.4s infinite ease-in-out both;
    }
    .dots span:nth-child(2){ animation-delay:.2s; }
    .dots span:nth-child(3){ animation-delay:.4s; }
    @keyframes pulse { 0%,80%,100%{ opacity:.35; transform:scale(.85); } 40%{ opacity:1; transform:scale(1); } }
    .fine { margin-top:26px; font-size:.85rem; color:var(--muted); }
  </style>
</head>
