###############################################################################
#
# FOR DOCKER-COMPOSE SETTINGS COMMON TO BOTH DEVELOPMENT AND PRODUCTION
#
# Do not edit this file for development changes only, instead use docker-compose.override.yml
#
# https://docs.docker.com/compose/extends/
################################################################################

# Fixes the Compose project name so container names and the default network are
# stable no matter what the checkout directory is called.
name: bytedeck

# web, celery and celery-beat all run the same Django image and differ only in
# the command they run, so their shared definition lives here and each service
# merges it in with `<<: *app`. The explicit `image` tag means one build is
# shared by all three instead of the same image being built under three names.
# (Extension fields, keys starting with "x-", are ignored by Compose, so this
# only takes effect where it is aliased in.)
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    # Enable below when uwsgi-nginx uses unix sock
    # args:
    #   WUID: $WUID
    #   WGID: $WGID
  image: bytedeck-app:latest
  env_file: .env
  networks:
    - backend-network
  depends_on:
    redis:
      condition: service_healthy

services:

  web:
    <<: *app
    # command: # see docker-compose.override.yml or docker-compose.prod.aws.yml
    # The published port and the source bind mount are development-only, so
    # they live in docker-compose.override.yml: in production nginx is the only
    # way in, and the code is the copy baked into the image.
    networks:
      - backend-network
      - frontend-network
    # Liveness: something is listening on :8000 (uwsgi in prod, runserver in
    # dev; TCP connect covers both). The long start_period covers the
    # migrate_schemas run before the server binds, which on a cold start with
    # migrations to apply walks every tenant schema -- failures during
    # start_period don't count against the container. Shown as
    # (healthy)/(unhealthy) in `docker compose ps`.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m

  celery:
    <<: *app
    command: bash -c "cd src &&
                      celery -A hackerspace_online worker -l info -c 3 -Q default"
    # Liveness: ask this worker to answer a ping over the broker. Catches a
    # worker that is running but disconnected/hung, not just a dead process.
    # Deliberately infrequent -- each check runs a full celery client.
    healthcheck:
      test: ["CMD-SHELL", "cd /app/src && celery -A hackerspace_online inspect ping -d celery@$$HOSTNAME -t 10 | grep -q pong"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 2m

  celery-beat:
    <<: *app
    command: bash -c "cd src &&
                      celery -A hackerspace_online beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    # Liveness: beat has no ping command, so check the scheduler process exists
    # (procps/pgrep is installed in the app image). A dead beat silently stops
    # all periodic tasks, so even a coarse signal is worth surfacing.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 2m

  # Redis: Celery broker (db 0) and Django cache (dbs 1/2), used by every
  # environment. Common config lives here; environment specifics are layered on
  # top: the dev override publishes the port for local runserver/tests, and the
  # AWS file adds the production memory cap / eviction policy / restart policy.
  # Internal-only by default: no published port, backend-network only.
  redis:
    image: redis:7-alpine
    sysctls:
      # Resolve -> # WARNING: The TCP backlog setting of 511 cannot be enforced because /proc/sys/net/core/somaxconn is set to the lower value of 128.
      net.core.somaxconn: 512
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - backend-network

# Two tiers: frontend-network carries public traffic between nginx and web,
# backend-network carries everything internal (the app services, redis, and the
# dev database). Only web sits on both, so nginx has no route to redis or the
# database.
networks:
  frontend-network:
  backend-network:
