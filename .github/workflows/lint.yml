name: Ruff

# Same trigger/concurrency scheme as build_and_test.yml: long-lived branches
# on push, every PR, and stale in-progress runs cancelled on new pushes.
on:
  push:
    branches: [develop, staging, master, competencies]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint with ruff
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install ruff
      # Install the version requirements.txt pins, so CI, the pre-commit hook and
      # a local venv all lint with the same ruff. requirements.txt is the single
      # place the version is set: the pre-commit hook runs whatever ruff is
      # installed rather than pinning its own copy, so there is no second pin that
      # could drift out of step with this one.
      run: |
        ruff_spec=$(grep -m1 -E '^ruff([<>=!~,]|$)' requirements.txt | cut -d'#' -f1 | tr -d '[:space:]')
        echo "Installing $ruff_spec"
        pip install "$ruff_spec"
    - name: Lint
      # Config lives in pyproject.toml ([tool.ruff]). --output-format=github
      # emits inline PR annotations (replaces the old flake8-annotations action).
      run: ruff check src --output-format=github
