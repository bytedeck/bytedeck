name: Ruff

# Same trigger/concurrency scheme as build_and_test.yml: long-lived branches
# on push, every PR, and stale in-progress runs cancelled on new pushes.
on:
  push:
    branches: [develop, staging, master, competencies]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint with ruff
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install ruff
      run: pip install ruff
    - name: Lint
      # Config lives in pyproject.toml ([tool.ruff]). --output-format=github
      # emits inline PR annotations (replaces the old flake8-annotations action).
      run: ruff check src --output-format=github
