name: Production Config

# The Build and Test workflow only ever renders docker-compose.yml plus
# docker-compose.override.yml, so nothing there looks at the production overlay.
# A production-only regression (the application port published straight to the
# host, say) therefore reaches a deploy without any check having seen it. These
# jobs close that gap.
#
# Scoped to the files that can actually affect the production topology, so the
# usual application PR does not pay for them, plus pushes to the long-lived
# branches as a backstop for anything that slips through the path filter.
# (The path list is repeated rather than shared through a YAML anchor because
# the workflow parser does not support anchors. Keep the two copies in step.)
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'nginx/**'
      - 'production/tests/**'
      - 'production/wait-for-healthy.sh'
      - '.env.example*'
      - '.github/workflows/production_config.yml'
  push:
    branches: [develop, staging, master]
    paths:
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'nginx/**'
      - 'production/tests/**'
      - 'production/wait-for-healthy.sh'
      - '.env.example*'
      - '.github/workflows/production_config.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# These jobs run code from the pull request, and the only thing here that needs
# the token is `actions/checkout`. Read-only keeps that code from receiving a
# writable GITHUB_TOKEN if the repository or org default ever grants one.
permissions:
  contents: read

jobs:
  config-contract:
    name: Production config contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Copy sample environment variables
        # `docker compose config` refuses to render while an env_file is
        # missing, so the sample stands in for the real deployment .env.
        run: cp .env.example .env
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Assert the production compose contract
        run: python production/tests/check_prod_compose.py

  deploy-health-gate:
    name: Deploy health gate
    runs-on: ubuntu-22.04
    # Deliberately no `needs`: this stubs `docker` rather than using it, so it
    # depends on nothing the other jobs establish and finishes in seconds.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert the deploy fails when the app does not come back
        run: bash production/tests/check_deploy_health_gate.sh

  image:
    name: Application image
    runs-on: ubuntu-22.04
    # Nothing here is worth running while the cheaper static check is failing.
    needs: config-contract
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the application image
        run: docker build -t bytedeck-app:check .
      - name: Assert the image runs unprivileged
        # The rendered compose config cannot see the image's own USER, so the
        # config contract can only catch an explicit root override. Production
        # relies on this default, since it sets no `user:` on the app services.
        run: |
          user=$(docker image inspect -f '{{.Config.User}}' bytedeck-app:check)
          if [ "$user" != "app" ]; then
            echo "FAIL  image runs as '${user:-root}', expected 'app'"
            exit 1
          fi
          echo "PASS  image runs as $user"
      - name: Assert the build toolchain stayed out of the runtime image
        # The whole point of the two-stage build: the compilers that build uwsgi
        # belong to the builder stage, not to what production ships and runs.
        run: |
          if docker run --rm bytedeck-app:check bash -c 'command -v gcc' >/dev/null 2>&1; then
            echo "FAIL  gcc is present in the runtime image; the build stage leaked into it"
            exit 1
          fi
          echo "PASS  no compiler in the runtime image"
      - name: Assert the healthcheck dependencies are installed
        # celery-beat's healthcheck in docker-compose.yml runs pgrep, which
        # comes from procps. Without it the container reports unhealthy forever.
        run: |
          docker run --rm bytedeck-app:check bash -c 'command -v pgrep' >/dev/null
          echo "PASS  pgrep is available for the celery-beat healthcheck"

  topology:
    name: Production topology
    runs-on: ubuntu-22.04
    # Nothing here is worth running while the cheaper static check is failing.
    needs: config-contract
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Copy sample environment variables
        run: cp .env.example .env
      - name: Boot the production topology and assert reachability
        run: bash production/tests/check_prod_topology.sh
