name: User Guide

# Builds the user guide (mkdocs.yml, docs/) on every PR that touches it, so a broken
# link or a missing image fails the check before it merges, and publishes it to
# GitHub Pages on each push to develop. Publishing needs the repository's Pages
# source set to "GitHub Actions" (Settings > Pages); until then the deploy job fails
# and the build job still checks the guide.
#
# Scoped to the files the guide is built from, so application PRs don't pay for it.
# (The path list is repeated rather than shared through a YAML anchor because the
# workflow parser does not support anchors. Keep the two copies in step.)
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  push:
    branches: [develop]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build the user guide
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install MkDocs
      run: pip install -r docs/requirements.txt
    - name: Build
      # --strict turns warnings, such as a link to a missing page or image, into errors.
      run: mkdocs build --strict
    - name: Upload the site for Pages
      if: github.ref == 'refs/heads/develop'
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

  deploy:
    name: Publish to GitHub Pages
    # develop only: a manual run on another branch checks the guide without publishing it
    if: github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v4
