###############################################################################
#
# FOR DOCKER-COMPOSE SETTINGS SPECIFIC TO AWS PRODUCTION
#
# Run with:
# `docker compose -f docker-compose.yml -f docker-compose.prod.aws.yml up -d`
#
# https://docs.docker.com/compose/extends/
################################################################################

# Bound every container's log file so unbounded stdout/stderr can't fill the
# host disk. Docker's default json-file driver keeps ONE log file that grows
# forever; on this single EC2 host a chatty or looping process would eventually
# consume all disk. max-size rotates each file and max-file caps how many are
# kept (so ~max-size * max-file per service). Tunable via .env; the anchor is
# applied to every service below. (Extension fields -- keys starting with "x-"
# -- are ignored by Compose, so this only takes effect where aliased in.)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

# Restart policies are production/staging-only on purpose: in development a
# crashed process should stay down and visible, not quietly loop-restart.
# (Healthchecks are shared and live in docker-compose.yml.)
x-prod-service: &prod-service
  logging: *default-logging
  restart: unless-stopped

services:
  # The app services deliberately declare no volumes: production runs the code
  # baked into the image, which production/server-update.sh rebuilds from the
  # deployed commit on every deploy. That keeps the image the thing that was
  # tested and shipped, rather than a container reading whatever happens to be
  # in the host checkout. They also inherit the image's unprivileged `app`
  # user, so none of them run as root.
  web:
    <<: *prod-service
    command: bash -c "cd /app/src/ &&
                      python manage.py migrate_schemas --shared &&
                      python manage.py migrate_schemas --executor=multiprocessing &&
                      python manage.py collectstatic --noinput &&
                      uwsgi --ini uwsgi.aws.ini ${UWSGI_EXTRA_ARGS:-}"

  celery:
    <<: *prod-service

  celery-beat:
    <<: *prod-service

  # Production/staging additions to the shared redis service (image, healthcheck,
  # network: see docker-compose.yml). Self-hosted on this EC2 host, replacing
  # AWS ElastiCache: reachable ONLY on the internal backend-network with no
  # published port, so it needs no password in this single-host setup.
  redis:
    <<: *prod-service
    # - maxmemory bounds the dataset so Redis can't starve the shared app host.
    #   The process itself sits a bit above this figure (allocator overhead and
    #   fragmentation), so leave headroom rather than reading it as an exact RSS
    #   cap. Override with REDIS_MAXMEMORY in .env; size it to the instance and
    #   working set.
    # - noeviction: never drop keys under memory pressure, so queued Celery/beat
    #   tasks are never silently lost. (If cache churn makes the cap tight,
    #   raise REDIS_MAXMEMORY, or switch to volatile-lru: cache entries carry a
    #   TTL and broker keys do not, so only cache keys would be evicted.)
    # - persistence disabled: the broker queue and cache are both disposable.
    command:
      - "redis-server"
      - "--maxmemory"
      # 512mb default: at the cap, noeviction makes redis reject every command
      # that needs more memory, so celery publishes fail too, not just cache
      # writes (reads and memory-freeing commands still work). 512mb leaves
      # headroom for a traffic burst while still leaving RAM for the app on this
      # shared host. Raise via REDIS_MAXMEMORY.
      - "${REDIS_MAXMEMORY:-512mb}"
      - "--maxmemory-policy"
      - "noeviction"
      - "--save"
      - ""
      - "--appendonly"
      - "no"

  nginx:
    <<: *prod-service
    build:
      context: ./nginx
      args:
        WUID: $WUID
        WGID: $WGID
        # Domain baked into the nginx config template (server_name, host check,
        # and cert paths). Reuses ROOT_DOMAIN from .env so production and
        # staging build the same image from one template.
        DOMAIN: $ROOT_DOMAIN
    volumes:
        - /etc/letsencrypt:/etc/letsencrypt
    #   - static_data:/var/www/bytedeck/static
    #   - socket_data:/bytedeck-volume
    #   - media_data:/var/www/bytedeck/media/
    ports:
      - "443:8088"
      - "80:8080"
    # Start ordering only. nginx must come up straight away, without waiting
    # for web to pass its healthcheck: web spends minutes running
    # migrate_schemas over every tenant schema and then collectstatic before
    # uwsgi binds :8000, and nginx serves the maintenance page for that whole
    # window. Gating on service_healthy would leave 443 unbound until the
    # migrations finished, so visitors would get a connection error instead of
    # the "ByteDeck is updating" page. nginx re-resolves `web` at request time
    # (see the resolver directive in nginx/bytedeck.conf.template), so it does
    # not need the upstream to exist when it starts.
    depends_on:
      - web
    # Runs as the host uid:gid because the Let's Encrypt certificates are
    # bind-mounted from the host and have to stay readable.
    user: $WUID:$WGID
    # Only the public tier: nginx talks to web and has no route to redis.
    networks:
      - frontend-network

# volumes:
#  static_data:       # commenting static_data volume as collectstatic cmd picking this up instead of S3 for STATIC_ROOT.
#  socket_data:
#  media_data:
