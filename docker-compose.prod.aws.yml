###############################################################################
#
# FOR DOCKER-COMPOSE SETTINGS SPECIFIC TO AWS PRODUCTION
#
# Run with:
# `docker compose -f docker-compose.yml -f docker-compose.prod.aws.yml up -d`
#
# https://docs.docker.com/compose/extends/
################################################################################

services:
  web:
    command: bash -c "cd /app/src/ &&
                      python manage.py migrate_schemas --shared &&
                      python manage.py migrate_schemas --executor=multiprocessing &&
                      python manage.py collectstatic --noinput &&
                      uwsgi --ini uwsgi.aws.ini"
    volumes:
      - .:/app
      # - static_data:/app/src/static  # use static dir as a fallback for hardcoded urls hitting app directly
      # - media_data:/app/media
      # - socket_data:/bytedeck-volume
    user: $WUID:$WGID

  celery:
    user: $WUID:$WGID

  # Production/staging additions to the shared redis service (image, healthcheck,
  # network — see docker-compose.yml). Self-hosted on this EC2 host, replacing
  # AWS ElastiCache: reachable ONLY on the internal backend-network with no
  # published port, so it needs no password in this single-host setup.
  redis:
    restart: unless-stopped
    # - maxmemory caps RAM so Redis can't OOM the shared app host (override with
    #   REDIS_MAXMEMORY in .env; size it to the instance and working set).
    # - noeviction: never drop keys under memory pressure, so queued Celery/beat
    #   tasks are never silently lost. (If cache churn makes the cap tight,
    #   raise REDIS_MAXMEMORY, or switch to volatile-lru — cache entries carry a
    #   TTL and broker keys do not, so only cache keys would be evicted.)
    # - persistence disabled: the broker queue and cache are both disposable.
    command:
      - "redis-server"
      - "--maxmemory"
      - "${REDIS_MAXMEMORY:-256mb}"
      - "--maxmemory-policy"
      - "noeviction"
      - "--save"
      - ""
      - "--appendonly"
      - "no"

  nginx:
    build:
      context: ./nginx
      args:
        WUID: $WUID
        WGID: $WGID
        # Domain baked into the nginx config template (server_name, host check,
        # and cert paths). Reuses ROOT_DOMAIN from .env so production and
        # staging build the same image from one template.
        DOMAIN: $ROOT_DOMAIN
    volumes:
        - /etc/letsencrypt:/etc/letsencrypt
    #   - static_data:/var/www/bytedeck/static
    #   - socket_data:/bytedeck-volume
    #   - media_data:/var/www/bytedeck/media/
    ports:
      - "443:8088"
      - "80:8080"
    depends_on:
      - web
    user: $WUID:$WGID
    networks:
      - backend-network

# volumes:
#  static_data:       # commenting static_data volume as collectstatic cmd picking this up instead of S3 for STATIC_ROOT.
#  socket_data:
#  media_data:


