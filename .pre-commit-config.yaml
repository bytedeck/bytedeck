repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files
        exclude: ^requirements/generated.txt

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [ "--py312-plus" ]
        types: [python]

  # ruff replaces flake8 (+bugbear/comprehensions/mutable plugins) and
  # autoflake (unused-import/variable removal via --fix on the F rules).
  # Config lives in pyproject.toml ([tool.ruff]); the formatter (ruff-format)
  # is deliberately not enabled.
  # This runs the ruff already installed from requirements.txt rather than a
  # copy pinned here, so requirements.txt is the only place the version is set
  # and the hook, CI and a local venv cannot lint with different rule sets.
  # It needs ruff on PATH, so commit with the project venv active; the hook fails
  # with "Executable `ruff` not found" if it isn't.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --force-exclude --fix
        language: system
        types_or: [ python, pyi ]
        require_serial: true

