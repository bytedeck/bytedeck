repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files
        exclude: ^requirements/generated.txt

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        # Target the project's actual runtime (Python 3.12). The old stacked
        # --py36/37/38-plus args predated the 3.12 migration; --py312-plus was
        # added in pyupgrade v3.15, hence the rev bump.
        args: [ "--py312-plus" ]
        types: [python]

  # ruff replaces flake8 (+bugbear/comprehensions/mutable plugins) and
  # autoflake (unused-import/variable removal via --fix on the F rules).
  # Config lives in pyproject.toml ([tool.ruff]); the formatter (ruff-format)
  # is deliberately not enabled.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: [ "--fix" ]

