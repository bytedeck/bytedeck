###############################################################################
#
# FOR DOCKER_COMPOSE SETTINGS SPECIFIC TO DEVELOPMENT
#
# run automatically with `docker compose up` on top of the the settings in docker-compose.yml
#
# docker-compose.override.yml
# https://docs.docker.com/compose/extends/
################################################################################

# Development and CI run the app straight from the host checkout, so the three
# app services bind-mount it over /app and run as root to write back into it
# (coverage output, makemigrations, __pycache__). The image's own unprivileged
# `app` user applies everywhere this override is not loaded, which is
# production. Aliased into each app service below.
x-app-dev: &app-dev
  volumes:
    - .:/app
  user: root
  environment:
    POSTGRES_HOST: db  # takes precendent over .env file
    REDIS_HOST: redis  # takes precendent over .env file
  depends_on:
    db:
      condition: service_healthy
    # (redis dependency is declared in docker-compose.yml)

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      # Helper scripts for loading a dump into a tenant schema, see
      # MULTITENANT-README.md.
      - ./postgresql/scripts:/scripts:ro
    networks:
      - backend-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
    # Published on the loopback interface only, so the database isn't reachable
    # from the local network. Lets the app connect when running outside the
    # container with `python src/manage.py [runserver|test src]`.
    - 127.0.0.1:5432:5432

  redis:
    # Common config (image, healthcheck, sysctls, network) lives in
    # docker-compose.yml; development only adds the published port.
    ports:
    - 127.0.0.1:6379:6379  # loopback only, see the db port above

  web:
    <<: *app-dev
    stdin_open: true
    tty: true   # Enabled together with stdin_open so it won't raise an error when we are in pdb mode. Attach using `docker attach $(docker compose ps -q web)`
    ports:
      - 8000:8000
    command: bash -c "cd /app/src/ &&
                      python manage.py migrate_schemas --shared &&
                      python manage.py migrate_schemas --executor=multiprocessing &&
                      python manage.py runserver 0.0.0.0:8000"   # no need for uwsgi in development, this is easier

  celery:
    <<: *app-dev

  celery-beat:
    <<: *app-dev

  # Optional: start it with `docker compose --profile tools up`, so a normal
  # `docker compose up` doesn't pay for a service most work never touches.
  pg-admin:
    profiles: ["tools"]
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - backend-network

volumes:
  postgres_data:
