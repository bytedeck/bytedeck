<script>

    $(document).ready(function() {
        // Flag and unflag submissions via Ajax when their buttons are clicked. Both post, so no
        // link or page load can change a flag (#2389), and neither needs a form of its own: the
        // buttons sit inside the approval form on the pages that include them.
        $(document).on('click', '.btn-flag-submission', function(event){
            event.preventDefault(); // prevent browser from reloading
            send_flag_change(this, "{% url 'quests:ajax_flag' %}", "flagged");
        });

        $(document).on('click', '.btn-unflag-submission', function(event){
            event.preventDefault(); // prevent browser from reloading
            send_flag_change(this, "{% url 'quests:ajax_unflag' %}", "unflagged");
        });

    });

    // Post the change for the button's submission, showing a spinner and then a tick in place of
    // the button's own icon. `done` names the change for the error message ("flagged").
    function send_flag_change(btn, url, done) {
        var $btn = $(btn);

        // the button's own icon: one <i> on the flag button, a stacked pair on the unflag button
        var $iconOriginal = $btn.children();
        var $iconSpin = $('<i class="fa fa-fw fa-spinner fa-spin"></i>');
        var $iconSuccess = $('<i style="display:none" class="fa fa-fw fa-check text-success"></i>');

        // a click while an earlier one is still showing its spinner or tick does nothing
        if ($btn.find('.fa-spinner, .fa-check').length == 0) {

            $iconOriginal.hide(0);
            $btn.append($iconSpin);
            $btn.append($iconSuccess);

            $.ajax({
                url : url,
                type : "POST", // http method
                data : {
                    csrfmiddlewaretoken: "{{ csrf_token }}",
                    submission_id: $btn.data('sub-id')
                }, // data sent with the post request

                // handle a successful response
                success : function(json) {
                    // fade out spinner and fade in check, then replace check with original icon after a couple seconds
                    $iconSpin.fadeOut(400, function() {
                    $iconSuccess.fadeIn(400, function() {
                        window.setTimeout(
                        function(){ $iconSuccess.remove(); $iconOriginal.show(0); $iconSpin.remove()},
                        2000
                        )
                    });
                    });
                },

                // handle a non-successful response
                error : function(xhr,errmsg,err) {
                    $iconSpin.remove(); $iconSuccess.remove(); $iconOriginal.show(0);
                    console.log(xhr.status + ": " + xhr.responseText); // provide a bit more info about the error to the console
                    alert("ERROR!\n\nSorry, something went wrong and the quest wasn't " + done + ".  \n\nSee the browser console for error details.");
                }
            });
        }
    }

</script>
