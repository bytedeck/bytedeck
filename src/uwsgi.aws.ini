# uwsgi config for production AND staging (staging mirrors prod).
# This file is used by docker-compose.prod.aws.yml -> `uwsgi --ini uwsgi.aws.ini`.
# Development does NOT use uwsgi at all -- see docker-compose.override.yml, which
# runs `manage.py runserver` instead.
#
# See:
#  - https://docs.djangoproject.com/en/4.2/howto/deployment/wsgi/uwsgi/
#  - https://uwsgi-docs.readthedocs.io/en/latest/tutorials/Django_and_nginx.html
#  - https://www.techatbloomberg.com/blog/configuring-uwsgi-production-deployment/
[uwsgi]
strict          = true          ; only explicitly understood configuration allowed
#touch-reload    = src/uwsgi.aws.ini  ; this file  # causes an error using this file!

# DJANGO SETTINGS ################

# the base directory (full path)
#chdir           = /app/src     ; Don't need to change, we're already there, see docker-compose.prod.aws.yml
module          = hackerspace_online.wsgi
#home            = /path/to/virtualenv  # no venv, dockerized.
need-app        = true          ; don't start if can't find or load django app

### PROCESS SETTINGS ###############

master          = true          ; gracefully re-spawn and pre-fork workers, consolidate logs, etc
enable-threads  = true
thunder-lock    = true
single-interpreter = true
die-on-term     = true

# `processes` is the HARD CEILING on worker processes; each worker is a full
# copy of Django, so the practical limit is instance RAM, not CPU. Rule of
# thumb: size it so (processes * peak-worker-RSS) leaves headroom on the box.
# To override without editing this file, append a flag after --ini on the
# command line, e.g. `uwsgi --ini uwsgi.aws.ini --processes 6` (last wins).
processes       = 10
threads         = 2

# Dynamic worker scaling ("cheaper" subsystem): instead of always pre-forking
# the maximum `processes`, keep a small floor of workers and spawn more only
# under load, then retire them when idle. This cuts idle memory dramatically
# while preserving peak capacity. https://uwsgi-docs.readthedocs.io/en/latest/Cheaper.html
cheaper-algo    = spare         ; always-available algo (no extra plugin needed)
cheaper         = 2             ; minimum workers to keep running
cheaper-initial = 2             ; workers to spawn at startup
cheaper-step    = 2             ; spawn this many extra workers at a time under load
cheaper-overload = 30           ; retire an idle worker after this many seconds

# The default 4KB request buffer is too small for multi-tenant subdomain
# requests carrying large session/CSRF cookies -> "invalid request block size"
# 500 errors. Bump it. https://uwsgi-docs.readthedocs.io/en/latest/ThingsToKnow.html
buffer-size     = 16384

socket          = 0.0.0.0:8000  ; TCP socket to nginx. A unix socket needs a volume shared
                                ; with the nginx container (see socket_data in the compose file);
                                ; the perf gain over TCP on a docker network is negligible, so we use TCP.

vacuum          = true          ; on exit, clean up any temporary files or UNIX sockets it created

### WORKER MANAGEMENT ##########
max-requests    = 1000          ; Restart workers after this many requests
max-worker-lifetime = 3600      ; Restart workers after this many seconds
reload-on-rss   = 1024          ; Restart a worker if its resident memory (MB) exceeds this -- a leak
                                ; safety net. Tune to observed per-worker RSS; too low causes thrashing.
worker-reload-mercy = 60        ; How long to wait before forcefully killing workers

harakiri        = 60            ; Forcefully kill workers stuck for >60s on a single request
harakiri-verbose = true         ; Log a backtrace when harakiri fires, so slow requests are diagnosable

# This setting is causing errors: https://github.com/unbit/uwsgi/issues/1978
# https://stackoverflow.com/questions/62250160/uwsgi-runtimeerror-cannot-release-un-acquired-lock
#py-call-osafterfork = true      ; Allow workers to receive signals such as signal.alarm

auto-procname   = true          ; Provide more useful name to workers
procname-prefix = "h10 "

### LOGGING ####################
disable-logging = true          ; Disable built-in per-request logging
log-4xx         = true          ; but log 4xx's anyway
log-5xx         = true          ; and 5xx's
#log-to          = /var/log/uwsgi.uwsgi.log

# Silence harmless tracebacks when a client disconnects mid-response (user
# navigates away / closes tab): "OSError: write error" / broken pipe spam.
ignore-sigpipe  = true
ignore-write-errors = true
disable-write-exception = true
